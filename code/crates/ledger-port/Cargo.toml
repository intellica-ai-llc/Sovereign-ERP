[package]
name = "ledger-port"
description = "Ledger Port: engine-neutral contract, in-memory reference ledger, invariants I1-I4 + LegalMove, reusable conformance suite and bounded model checker (Appendix D, ADR 002)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Seeds known defects into MemLedger so tests can prove the invariants can fail. Never ship enabled.
fault-injection = []

[dev-dependencies]
sim = { path = "../sim" }
ledger-port = { path = ".", features = ["fault-injection"] }
