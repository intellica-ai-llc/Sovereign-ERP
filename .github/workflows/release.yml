# Publishes an evaluation release when a version tag is pushed (for example v0.1.0).
#
# STATUS: written but NOT yet exercised: the sandbox this repository was prepared in cannot run GitHub
# Actions or reach the signing services. Before relying on it, push a tag to a private fork and check
# every step. The build and packaging steps (`cargo xtask dist`) are tested; signing and attestation are not.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # create the release
  id-token: write # keyless signing (Sigstore)
  attestations: write # build provenance
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Verify the tag matches the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)".*/\1/p' Cargo.toml | head -1)"
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml version v$version"; exit 1; }
      - run: cargo xtask ci
      - run: cargo xtask dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: sigstore/cosign-installer@v3
      - name: Sign the tarball (keyless)
        run: |
          for f in dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --prerelease --title "Evaluation build ${GITHUB_REF_NAME}" \
            --notes "Evaluation build for pilot partners. Verify before use: see docs/EVALUATION-GUIDE.md. Not licensed for production use." \
            dist/*.tar.gz dist/*.sigstore.json dist/SHA256SUMS dist/sbom.cdx.json
