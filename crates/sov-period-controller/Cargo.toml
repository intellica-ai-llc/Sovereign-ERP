[package]
name = "sov-period-controller"
description = "Period Controller: the period-close state machine of arc42 Appendix M (pure decide/evolve, no I/O)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Seeds known defects so tests can prove the invariants are able to fail. Test-only: it is enabled
# through the self dev-dependency below, which Cargo never applies to a normal or release build.
fault-injection = []

[dev-dependencies]
sov-period-controller = { path = ".", features = ["fault-injection"] }
sov-sim.workspace = true

[lints]
workspace = true
