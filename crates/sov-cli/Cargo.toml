[package]
name = "sov-cli"
description = "The `sov` command-line tool: evaluation build for profiling a source database export, auditing balances and running the built-in demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "sov_cli"
path = "src/lib.rs"

[[bin]]
name = "sov"
path = "src/main.rs"

[dependencies]
sov-evidence = { path = "../sov-evidence" }
sov-period-controller.workspace = true
sov-profiler = { path = "../sov-profiler" }
sov-sync = { path = "../sov-sync" }

[lints]
workspace = true
