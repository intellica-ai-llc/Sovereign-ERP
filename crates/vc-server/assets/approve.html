<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1f4fd8">
<title>VeriChain Approvals</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mut:#5b6472;--line:#dde1e7;--ok:#0a7d3c;--bad:#b3261e;--acc:#1f4fd8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--ink:#e8ecf2;--mut:#98a2b3;--line:#2a313b;--ok:#4cc380;--bad:#ff7b72;--acc:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
button,input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
button{background:var(--acc);color:#fff;border-color:var(--acc);margin-top:8px;cursor:pointer}button.deny{background:transparent;color:var(--bad);border-color:var(--bad)}
.k{color:var(--mut);font-size:13px}.msg{min-height:1.4em}.ok{color:var(--ok)}.bad{color:var(--bad)}h1{font-size:20px}
</style></head><body><main>
<h1>Approvals</h1>
<div id="login" class="card"><div class="k">Tenant API key (kept in this tab only)</div><input id="key" type="password" autocomplete="off" placeholder="vck_..."><button id="go">Open</button></div>
<div id="app" hidden>
<div class="card"><div class="k">This device</div><button id="enrol">Enrol this device's passkey</button></div>
<div id="list"></div><button id="refresh" class="deny">Refresh</button></div>
<p id="msg" class="msg"></p>
<script>
const $=id=>document.getElementById(id);let KEY="";
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"=".repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
const say=(t,c)=>{$("msg").textContent=t;$("msg").className="msg "+(c||"")};
async function api(path,method,body){
 const r=await fetch(path,{method:method||"GET",headers:{Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j}
async function refresh(){
 const d=await api("/v1/approvals/pending");const l=$("list");l.replaceChildren();
 if(!d.pending.length){const p=document.createElement("p");p.className="k";p.textContent="Nothing waiting for approval.";l.appendChild(p)}
 for(const a of d.pending){
  const c=document.createElement("div");c.className="card";
  const t=document.createElement("div");t.textContent=(a.summary&&typeof a.summary==="string")?a.summary:"(no summary)";c.appendChild(t);
  const m=document.createElement("div");m.className="k";m.textContent=a.agent+" · "+(a.action_class||"action")+" · "+a.ts;c.appendChild(m);
  for(const dec of ["approve","deny"]){const b=document.createElement("button");b.textContent=dec==="approve"?"Approve with passkey":"Deny with passkey";if(dec==="deny")b.className="deny";
   b.onclick=()=>decide(a.action_id,dec);c.appendChild(b)}
  l.appendChild(c)}}
async function decide(id,dec){
 try{say("Waiting for your passkey…");
  const ch=await api("/v1/approvals/challenge","POST",{action_id:id,decision:dec});
  const cred=await navigator.credentials.get({publicKey:{challenge:unb64u(ch.challenge),rpId:ch.rp_id,userVerification:"required",timeout:60000,
   allowCredentials:ch.credential_ids.map(i=>({type:"public-key",id:unb64u(i)}))}});
  const r=cred.response;
  await api("/v1/approvals","POST",{challenge:ch.challenge,credential_id:b64u(cred.rawId),authenticator_data:b64u(r.authenticatorData),client_data_json:b64u(r.clientDataJSON),signature:b64u(r.signature)});
  say(dec==="approve"?"Approved and recorded.":"Denial recorded.","ok");await refresh()}
 catch(e){say(e.message,"bad")}}
$("enrol").onclick=async()=>{try{
 const ch=await api("/v1/approvers/challenge","POST",{});
 const cred=await navigator.credentials.create({publicKey:{challenge:unb64u(ch.challenge),rp:{id:ch.rp_id,name:"VeriChain"},
  user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"approver",displayName:"Approver"},pubKeyCredParams:[{type:"public-key",alg:-7}],
  authenticatorSelection:{residentKey:"preferred",userVerification:"required"},attestation:"none",timeout:60000}});
 const name=prompt("Name for this approver","Me")||"Approver";
 await api("/v1/approvers","POST",{name,credential_id:b64u(cred.rawId),public_key:b64u(cred.response.getPublicKey()),client_data_json:b64u(cred.response.clientDataJSON),challenge:ch.challenge});
 say("Passkey enrolled.","ok")}catch(e){say(e.message,"bad")}};
$("go").onclick=async()=>{KEY=$("key").value.trim();try{await refresh();$("login").hidden=true;$("app").hidden=false;say("")}catch(e){say(e.message,"bad")}};
$("refresh").onclick=()=>refresh().catch(e=>say(e.message,"bad"));
</script></main></body></html>
