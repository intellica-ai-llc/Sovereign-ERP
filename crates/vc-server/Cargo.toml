[package]
name = "vc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VeriChain hosted log server: multi-tenant ingest, checkpoints, proofs and dashboard API"

[[bin]]
name = "vc-server"
path = "src/main.rs"

[dependencies]
vc-core = { path = "../vc-core" }
vc-cose = { path = "../vc-cose" }
vc-log = { path = "../vc-log" }
vc-seq = { path = "../vc-seq" }
vc-store = { path = "../vc-store" }
vc-verify = { path = "../vc-verify" }
vc-license = { path = "../vc-license" }
mas-data = { path = "../mas-data" }
mas-research = { path = "../mas-research" }
ureq = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }

[dev-dependencies]
vc-witness = { path = "../vc-witness" }
tower = { version = "0.5", features = ["util"] }
vc-verify = { path = "../vc-verify" }
http-body-util = "0.1"
