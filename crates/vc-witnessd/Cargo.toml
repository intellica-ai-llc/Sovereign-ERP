[package]
name = "vc-witnessd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VeriChain witness daemon: C2SP add-checkpoint HTTP API over vc-witness"

[[bin]]
name = "vc-witnessd"
path = "src/main.rs"

[dependencies]
vc-core = { path = "../vc-core" }
vc-log = { path = "../vc-log" }
vc-witness = { path = "../vc-witness" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
ed25519-dalek.workspace = true
base64.workspace = true
hex.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
