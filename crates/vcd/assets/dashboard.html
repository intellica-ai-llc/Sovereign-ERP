<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VeriChain dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#5b6573;--ok:#0a7d3b;--bad:#b3261e;--ln:#dde1e7;--ac:#1d4ed8}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--tx:#e8ebf0;--mut:#9aa5b4;--ok:#4ade80;--bad:#f87171;--ln:#2a313b;--ac:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--ln);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}main{max-width:1000px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.big{font-size:22px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
code,pre{font:12px ui-monospace,monospace}pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:10px;border-radius:8px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
button.act{background:var(--ac);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font:inherit;margin:4px 6px 4px 0}
.hide{display:none}
</style></head><body>
<header><h1>VeriChain</h1><span class="mut">local evidence dashboard</span><span id="badge" class="big"></span></header>
<main>
<nav id="tabs"></nav>
<div id="v-exec"></div><div id="v-audit" class="hide"></div><div id="v-agents" class="hide"></div><div id="v-eng" class="hide"></div>
</main>
<script>
const $=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,y]of Object.entries(a))e[x]=y;for(const c of k)e.append(c instanceof Node?c:document.createTextNode(String(c)));return e};
const views={exec:'Overview',audit:'Auditor',agents:'Agents',eng:'Engineer'};
let S=null;
function show(id){for(const k in views){document.getElementById('v-'+k).classList.toggle('hide',k!==id);}
 for(const b of document.querySelectorAll('#tabs button'))b.classList.toggle('on',b.dataset.k===id)}
function tabs(){const n=document.getElementById('tabs');n.replaceChildren();
 for(const[k,l]of Object.entries(views)){const b=$('button',{},l);b.dataset.k=k;b.onclick=()=>show(k);n.append(b)}}
function checks(rep){const t=$('table',{});t.append($('tr',{},$('th',{},'Check'),$('th',{},'Result'),$('th',{},'Detail')));
 for(const c of rep.checks)t.append($('tr',{},$('td',{},c.name),$('td',{className:c.ok?'ok':'bad'},c.ok?'PASS':'FAIL'),$('td',{className:'mut'},c.detail)));return t}
function agentsOf(st){const m={};for(const s of st){const a=m[s.agent]??={n:0,intent:0,outcome:0,seal:false,first:s.ts,last:s.ts};
 a.n++;if(s.kind==='intent')a.intent++;if(s.kind==='outcome')a.outcome++;if(s.kind==='lifecycle')a.seal=true;a.last=s.ts}return m}
function render(){const r=S.report,st=S.statements,ag=agentsOf(st);
 const b=document.getElementById('badge');b.textContent=r.ok?'VERIFIED':'NOT VERIFIED';b.className='big '+(r.ok?'ok':'bad');
 const x=document.getElementById('v-exec');x.replaceChildren(
  $('div',{className:'card'},$('div',{className:'big '+(r.ok?'ok':'bad')},r.ok?'Every record checks out':'Verification failed'),
   $('p',{className:'mut'},r.ok?'Each decision below was signed by its agent, included in a tamper-evident log, and the log was countersigned by independent witnesses. Nothing was removed from the end.':'At least one check failed. Do not rely on this evidence. See the Auditor tab.')),
  $('div',{className:'grid'},
   ...[['Statements',st.length],['Agents',Object.keys(ag).length],['Witnesses required',S.trust.min_witnesses],['Checks passed',r.checks.filter(c=>c.ok).length+' / '+r.checks.length]]
   .map(([k,v])=>$('div',{className:'card'},$('div',{className:'mut'},k),$('div',{className:'big'},v)))),
  $('div',{className:'card'},$('b',{},'Prove it works'),$('p',{className:'mut'},'These buttons change a copy of the evidence in memory and re-run the verifier. The files on disk are not touched.'),
   $('button',{className:'act',onclick:()=>tam('edit')},'Edit a past statement'),$('button',{className:'act',onclick:()=>tam('drop')},'Hide the latest activity'),$('div',{id:'tamout'})));
 const a=document.getElementById('v-audit');a.replaceChildren(
  $('div',{className:'card'},$('b',{},'Verification report'),checks(r)),
  $('div',{className:'card'},$('b',{},'Trust anchors pinned by you (trust.json)'),$('pre',{},JSON.stringify(S.trust,null,1))),
  $('div',{className:'card'},$('b',{},'Policy (policy.json)'),$('pre',{},JSON.stringify(S.policy)) ,
   $('p',{className:'mut'},'Independent re-check: '),$('pre',{},'vcv verify pack.json --trust trust.json --policy policy.json --require-seals'),
   $('a',{href:'/pack.json',download:'pack.json'},'Download pack.json')));
 const g=document.getElementById('v-agents');g.replaceChildren(...Object.entries(ag).map(([id,v])=>
  $('div',{className:'card'},$('b',{},id),$('p',{className:'mut'},v.n+' statements ('+v.intent+' intents, '+v.outcome+' outcomes). '+(v.seal?'Sealed: the count of its statements is committed.':'NOT sealed: its newest activity could be hidden.')),
   $('p',{className:'mut'},v.first+' to '+v.last))));
 const e=document.getElementById('v-eng');const t=$('table',{});t.append($('tr',{},...['#','agent','seq','kind','time','action','details'].map(h=>$('th',{},h))));
 for(const s of st)t.append($('tr',{},$('td',{},s.i),$('td',{},s.agent),$('td',{},s.seq),$('td',{},s.kind),$('td',{},s.ts),$('td',{},s.action?s.action.type+' '+s.action.target:''),$('td',{},s.ext?JSON.stringify(s.ext):'')));
 e.replaceChildren($('div',{className:'card'},$('b',{},'Signed checkpoint'),$('pre',{},S.checkpoint)),$('div',{className:'card'},$('b',{},'All statements (decoded from the signed bytes)'),t))}
async function tam(m){const o=document.getElementById('tamout');o.replaceChildren($('p',{},'Checking...'));
 const j=await (await fetch('/api/tamper?mode='+m)).json();const bad=j.report.checks.filter(c=>!c.ok);
 o.replaceChildren($('p',{},j.what),$('p',{className:bad.length?'ok':'bad',style:'font-weight:700'},bad.length?'Caught. The verifier rejected it: '+bad.map(c=>c.name).join(', '):'NOT caught (this would be a bug).'),checks(j.report))}
(async()=>{tabs();try{S=await (await fetch('/api/state')).json();if(S.error)throw new Error(S.error);render();show('exec')}
 catch(e){document.getElementById('v-exec').replaceChildren($('div',{className:'card bad'},'Cannot load evidence: '+e.message))}})();
</script></body></html>
